name: compass_flutter
description: "A local school community app with fictional school data."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  enough_icalendar: ^0.17.0
  file_selector: ^1.1.0
  timezone: ^0.11.0
  html_unescape: ^2.0.0
  cryptography: ^2.9.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/branding/compass-icon.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
